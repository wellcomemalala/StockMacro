    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    body {

    input, select {

    button {
      background-color: #4CAF50;

    table {

    .status-warning {

    .status-normal {

    .search-input {

    .tab-container {

        padding: 8px;

      }

      .staff-buttons {
        flex-direction: column;
      }
    }

<body>
  <div class="container">
    <header>
      <h1>ระบบสต๊อคแมคโคร - ร้านอาหารแวะถัวะ</h1>
      <p id="currentDate"></p>
    </header>

    <div class="tab-container">
      <div class="tab active" data-tab="stock">รายการสต๊อค</div>
      <div class="tab" data-tab="add">เพิ่มสินค้า</div>
      <div class="tab" data-tab="history">ประวัติการอัพเดท</div>
    </div>

    <div id="stockTab" class="tab-content card active">
      <div class="search-bar">
  <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาสินค้า...">
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <button onclick="exportToImage()">
      <i class="fas fa-download"></i> Export เป็นรูปภาพ
    </button>
    <button onclick="backupData()">
      <i class="fas fa-database"></i> สำรองข้อมูล
    </button>
    <button onclick="document.getElementById('restoreFile').click()">
      <i class="fas fa-upload"></i> กู้คืนข้อมูล
    </button>
    <input type="file" id="restoreFile" accept=".json" style="display: none;">
  </div>
</div>
      
      <div id="stockList">
        <div class="loading">กำลังโหลดข้อมูล...</div>
      </div>
    </div>

    <div id="addTab" class="tab-content card">
      <h2>เพิ่มรายการสินค้า</h2>
      <form id="addItemForm">
        <div class="form-group">
          <label for="itemName">ชื่อสินค้า</label>
          <input type="text" id="itemName" required>
        </div>
        
        <div class="form-group">
          <label for="itemQuantity">จำนวน</label>
          <input type="number" id="itemQuantity" min="0" required>
        </div>
        
        <div class="form-group">
          <label for="itemUnit">หน่วย</label>
          <input type="text" id="itemUnit" placeholder="เช่น ขวด, กล่อง, ถุง" required>
        </div>
        
        <div class="form-group">
          <label for="minQuantity">จำนวนขั้นต่ำที่ควรมี</label>
          <input type="number" id="minQuantity" min="0" required>
        </div>

        <div class="form-group">
          <label>ชื่อพนักงาน (กรุณาเลือกชื่อพนักงานที่อัพเดทสินค้านี้)</label>
          <div class="staff-buttons">
            <button type="button" class="staff-btn" data-staff="ดาว">ดาว</button>
            <button type="button" class="staff-btn" data-staff="แจง">แจง</button>
            <button type="button" class="staff-btn" data-staff="ซี">ซี</button>
            <button type="button" class="staff-btn" data-staff="เจี๊ยบ">เจี๊ยบ</button>
            <button type="button" class="staff-btn" data-staff="เป้">เป้</button>
            <button type="button" class="staff-btn" data-staff="เมย์">เมย์</button>
            <button type="button" class="staff-btn" data-staff="กีต้า">กีต้า</button>
            <button type="button" class="staff-btn" data-staff="โบว์">โบว์</button>
          </div>
          <input type="hidden" id="selectedStaff" required>
        </div>

        <input type="hidden" id="editItemId">
        <button type="submit" id="submitBtn">เพิ่มสินค้า</button>
        <button type="button" id="cancelBtn" style="display:none; background-color:#ccc;">ยกเลิก</button>

    </div>

    <div id="historyTab" class="tab-content card">
      <h2>ประวัติการอัพเดทสินค้า</h2>

  <script>
  
  
  
  // เพิ่มฟังก์ชันนี้ในส่วน script
window.backupData = function() {
  stockRef.once('value').then((snapshot) => {
    const data = snapshot.val();
    if (!data) {
      showNotification('ไม่มีข้อมูลให้สำรอง', 'error');
      return;
    }
    
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `stock-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showNotification('สำรองข้อมูลสำเร็จ');
  }).catch((error) => {
    showNotification('สำรองข้อมูลไม่สำเร็จ', 'error');
    console.error('Backup error:', error);
  });
};


  
  // เพิ่มฟังก์ชันนี้ก่อนส่วน Firebase configuration
window.exportToImage = function() {
  const stockTable = document.querySelector('#stockList table');

  html2canvas(stockTable, {
    scrollY: -window.scrollY, // จัดการการสกรอล
    allowTaint: true,
    useCORS: true,
    logging: true,
    windowHeight: stockTable.scrollHeight
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'stock-report-' + new Date().toISOString() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showNotification('ส่งออกรูปภาพสำเร็จ');
  }).catch(error => {
    console.error('Error exporting:', error);
    showNotification('ส่งออกรูปภาพไม่สำเร็จ', 'error');
  });
};
  function updateQuantity(itemId, currentQty, isIncrement) {
  // สร้าง modal สำหรับเลือกจำนวนและพนักงาน
  const quantityModal = document.createElement('div');
  quantityModal.className = 'modal';
  quantityModal.style.display = 'block';
  
  // สร้างเนื้อหาใน modal
  const modalContent = document.createElement('div');
  modalContent.className = 'modal-content';
  modalContent.style.width = '350px';
  
  // สร้างหัวข้อ
  const modalTitle = document.createElement('h3');
  modalTitle.textContent = isIncrement ? 'เพิ่มจำนวนสินค้า' : 'ลดจำนวนสินค้า';
  
  // สร้างส่วนเลือกจำนวน
  const quantitySection = document.createElement('div');
  quantitySection.style.margin = '15px 0';
  
  const quantityLabel = document.createElement('label');
  quantityLabel.textContent = 'เลือกจำนวน:';
  quantityLabel.style.display = 'block';
  quantityLabel.style.marginBottom = '5px';
  quantityLabel.style.fontWeight = '500';
  
  const quantityButtonsDiv = document.createElement('div');
  quantityButtonsDiv.style.display = 'flex';
  quantityButtonsDiv.style.gap = '10px';
  quantityButtonsDiv.style.marginBottom = '15px';
  
  // สร้างปุ่มเลือกจำนวน 1-5
  const quantities = [1, 2, 3, 4, 5];
  let selectedQuantity = 1; // ค่าเริ่มต้น
  
  quantities.forEach(qty => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = qty.toString();
    button.style.padding = '8px 12px';
    button.style.backgroundColor = qty === 1 ? '#4CAF50' : '#e0e0e0';
    button.style.color = qty === 1 ? 'white' : 'black';
    button.style.border = 'none';
    button.style.borderRadius = '4px';
    button.style.cursor = 'pointer';
    button.style.width = '40px';
    
    button.addEventListener('click', () => {
      // รีเซ็ตสีของปุ่มทั้งหมด
      quantityButtonsDiv.querySelectorAll('button').forEach(btn => {
        btn.style.backgroundColor = '#e0e0e0';
        btn.style.color = 'black';
      });
      
      // ไฮไลท์ปุ่มที่เลือก
      button.style.backgroundColor = '#4CAF50';
      button.style.color = 'white';
      
      selectedQuantity = qty;
    });
    
    quantityButtonsDiv.appendChild(button);
  });
  
  // เพิ่มช่องกรอกจำนวนเอง
  const customQuantityDiv = document.createElement('div');
  customQuantityDiv.style.marginBottom = '15px';
  
  const customQuantityLabel = document.createElement('label');
  customQuantityLabel.textContent = 'หรือใส่จำนวนเอง:';
  customQuantityLabel.style.display = 'block';
  customQuantityLabel.style.marginBottom = '5px';
  customQuantityLabel.style.fontWeight = '500';
  
  const customQuantityInput = document.createElement('input');
  customQuantityInput.type = 'number';
  customQuantityInput.min = '1';
  customQuantityInput.placeholder = 'จำนวนที่ต้องการ';
  customQuantityInput.style.width = '100%';
  customQuantityInput.style.padding = '10px';
  customQuantityInput.style.border = '1px solid #ddd';
  customQuantityInput.style.borderRadius = '4px';
  customQuantityInput.style.fontSize = '16px';
  
  customQuantityInput.addEventListener('input', () => {
    if (customQuantityInput.value) {
      // รีเซ็ตปุ่มเลือกจำนวน
      quantityButtonsDiv.querySelectorAll('button').forEach(btn => {
        btn.style.backgroundColor = '#e0e0e0';
        btn.style.color = 'black';
      });
      
      selectedQuantity = parseInt(customQuantityInput.value) || 1;
    }
  });
  
  customQuantityDiv.appendChild(customQuantityLabel);
  customQuantityDiv.appendChild(customQuantityInput);
  
  // สร้างหัวข้อเลือกพนักงาน
  const staffSectionTitle = document.createElement('h4');
  staffSectionTitle.textContent = 'เลือกชื่อพนักงาน';
  staffSectionTitle.style.marginTop = '20px';
  staffSectionTitle.style.marginBottom = '10px';
  
  // สร้างปุ่มสำหรับพนักงานแต่ละคน
  const staffNames = ['ดาว', 'แจง', 'ซี', 'เจี๊ยบ', 'เป้', 'เมย์', 'กีต้า', 'โบว์'];
  const staffButtonsDiv = document.createElement('div');
  staffButtonsDiv.className = 'staff-buttons';
  staffButtonsDiv.style.display = 'flex';
  staffButtonsDiv.style.flexWrap = 'wrap';
  staffButtonsDiv.style.gap = '10px';
  staffButtonsDiv.style.margin = '15px 0';
  
  let selectedStaff = null;
  
  staffNames.forEach(name => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'staff-btn';
    button.textContent = name;
    button.style.padding = '8px 15px';
    button.style.backgroundColor = '#e0e0e0';
    button.style.border = 'none';
    button.style.borderRadius = '4px';
    button.style.cursor = 'pointer';
    
    button.addEventListener('click', () => {
      // รีเซ็ตสีของปุ่มพนักงานทั้งหมด
      staffButtonsDiv.querySelectorAll('button').forEach(btn => {
        btn.style.backgroundColor = '#e0e0e0';
        btn.style.color = 'black';
      });
      
      // ไฮไลท์ปุ่มพนักงานที่เลือก
      button.style.backgroundColor = '#4CAF50';
      button.style.color = 'white';
      
      selectedStaff = name;
    });
    
    staffButtonsDiv.appendChild(button);
  });
  
  // สร้างปุ่มยืนยันและยกเลิก
  const buttonGroup = document.createElement('div');
  buttonGroup.style.display = 'flex';
  buttonGroup.style.gap = '10px';
  buttonGroup.style.marginTop = '20px';
  
  // ปุ่มยืนยัน
  const confirmButton = document.createElement('button');
  confirmButton.textContent = 'ยืนยัน';
  confirmButton.style.backgroundColor = '#4CAF50';
  confirmButton.style.color = 'white';
  confirmButton.style.border = 'none';
  confirmButton.style.padding = '10px 15px';
  confirmButton.style.borderRadius = '4px';
  confirmButton.style.cursor = 'pointer';
  confirmButton.style.flex = '1';
  
  confirmButton.addEventListener('click', () => {
    if (!selectedStaff) {
      showNotification("กรุณาเลือกชื่อพนักงาน", "error");
      return;
    }
    
    // คำนวณจำนวนใหม่
    let newQty;
    if (isIncrement) {
      newQty = currentQty + selectedQuantity;
    } else {
      newQty = currentQty - selectedQuantity;
      if (newQty < 0) newQty = 0; // ป้องกันจำนวนติดลบ
    }
    
    // ลบ modal
    document.body.removeChild(quantityModal);
    
    // ดำเนินการอัพเดทข้อมูล
    const itemRef = stockItemRef(itemId);

    itemRef.once('value', (snapshot) => {
      const item = snapshot.val();
      if (!item) return;

      const oldQty = item.quantity;
      const updatedData = {
        quantity: newQty,
        lastUpdated: new Date().toISOString(),
        updatedBy: selectedStaff
      };

      itemRef.update(updatedData).then(() => {
        // เพิ่มประวัติ
        historyRef.push({
          type: 'update',
          itemName: item.name,
          oldQuantity: oldQty,
          newQuantity: newQty,
          unit: item.unit,
          updatedBy: selectedStaff,
          timestamp: new Date().toISOString(),
          date: new Date().toLocaleDateString('th-TH')
        });

        document.getElementById(`qty-${itemId}`).textContent = newQty;
        showNotification("อัปเดทจำนวนสำเร็จ");
      }).catch((error) => {
        showNotification("เกิดข้อผิดพลาด: " + error.message, "error");
      });
    });
  });
  
  // ปุ่มยกเลิก
  const cancelButton = document.createElement('button');
  cancelButton.textContent = 'ยกเลิก';
  cancelButton.style.backgroundColor = '#ccc';
  cancelButton.style.color = 'black';
  cancelButton.style.border = 'none';
  cancelButton.style.padding = '10px 15px';
  cancelButton.style.borderRadius = '4px';
  cancelButton.style.cursor = 'pointer';
  cancelButton.style.flex = '1';
  
  cancelButton.addEventListener('click', () => {
    document.body.removeChild(quantityModal);
  });
  
  buttonGroup.appendChild(confirmButton);
  buttonGroup.appendChild(cancelButton);
  
  // เพิ่มองค์ประกอบเข้าไปใน modal
  modalContent.appendChild(modalTitle);
  quantitySection.appendChild(quantityLabel);
  quantitySection.appendChild(quantityButtonsDiv);
  modalContent.appendChild(quantitySection);
  modalContent.appendChild(customQuantityDiv);
  modalContent.appendChild(staffSectionTitle);
  modalContent.appendChild(staffButtonsDiv);
  modalContent.appendChild(buttonGroup);
  quantityModal.appendChild(modalContent);
  
  // เพิ่ม modal เข้าไปในหน้าเว็บ
  document.body.appendChild(quantityModal);
  
  // ปิด modal เมื่อคลิกนอกกรอบ
  quantityModal.addEventListener('click', (event) => {
    if (event.target === quantityModal) {
      document.body.removeChild(quantityModal);
    }
  });
}

    // Load history items
    function loadHistoryItems() {
      historyRef.orderByChild('timestamp').on('value', (snapshot) => {
        const historyList = document.getElementById('historyList');
        if (!snapshot.exists()) {
          historyList.innerHTML = '<p>ไม่พบประวัติการอัพเดท</p>';
          return;
        }
        
        const histories = [];
        snapshot.forEach(childSnapshot => {
          histories.push({
            key: childSnapshot.key,
            ...childSnapshot.val()
          });
        });
        
        // Sort by timestamp (newest first)
        histories.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        // Group by date
        const groupedByDate = {};
        histories.forEach(history => {
          const date = history.date || new Date(history.timestamp).toLocaleDateString('th-TH');
          if (!groupedByDate[date]) {
            groupedByDate[date] = [];
          }
          groupedByDate[date].push(history);
        });
        
        let historyHTML = '';
        
        for (const date in groupedByDate) {
          historyHTML += `<div class="history-date">${date}</div>`;
          
          groupedByDate[date].forEach(history => {
            const time = new Date(history.timestamp).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
            
            if (history.type === 'add') {
              historyHTML += `
                <div class="history-item">
                  <p>${time} - <strong>${history.addedBy}</strong> เพิ่มสินค้า <strong>${history.itemName}</strong> จำนวน ${history.quantity} ${history.unit}</p>
                </div>
              `;
            } else if (history.type === 'update') {
              historyHTML += `
                <div class="history-item">
                  <p>${time} - <strong>${history.updatedBy}</strong> อัพเดทสินค้า <strong>${history.itemName}</strong> จาก ${history.oldQuantity} ${history.unit} เป็น ${history.newQuantity} ${history.unit}</p>
                </div>
              `;
            } else if (history.type === 'delete') {
              historyHTML += `
                <div class="history-item">
                  <p>${time} - <strong>${history.deletedBy}</strong> ลบสินค้า <strong>${history.itemName}</strong> จำนวน ${history.quantity} ${history.unit}</p>
                </div>
              `;
            }
          });
        }
        
        historyList.innerHTML = historyHTML;
      });
    }

document.getElementById('restoreFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);

      // ✅ FIX: ตรวจโครงสร้างไฟล์ก่อน กันเอาไฟล์ backup ของระบบอื่นมาทับ
      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        showNotification('รูปแบบไฟล์ไม่ถูกต้อง', 'error');
        e.target.value = '';
        return;
      }
      const FOREIGN = ['racing_order_app', 'pos_cashier_v1', 'restaurant_pos_v1', 'stock_macro_v1', 'orders', 'completedOrders'];
      if (Object.keys(data).some(k => FOREIGN.indexOf(k) !== -1)) {
        showNotification('ไฟล์นี้เป็น backup ของระบบอื่น — ยกเลิกเพื่อความปลอดภัย', 'error');
        e.target.value = '';
        return;
      }
      const bad = Object.values(data).find(v => !v || typeof v !== 'object' || typeof v.name !== 'string');
      if (bad) {
        showNotification('ไฟล์นี้ไม่ใช่ข้อมูลสต๊อค', 'error');
        e.target.value = '';
        return;
      }

      const n = Object.keys(data).length;
      if (!confirm('⚠️ กู้คืนสต๊อค ' + n + ' รายการ ใช่ไหม?\nสต๊อคปัจจุบันจะถูกแทนที่ทั้งหมด (ประวัตไม่หาย)')) {
        e.target.value = '';
        return;
      }

      // ✅ FIX: เขียนทีเดียวแบบ atomic ที่ stock เท่านั้น
      // (เดิม remove() ก่อนแล้วค่อยเขียนจาก root → ถ้าเน็ตหลุดกลางคัน ข้อมูลหายเกลี้ยง)
      stockRef.set(data).then(() => {
        showNotification('กู้คืนข้อมูลสำเร็จ (' + n + ' รายการ)');
        loadStockItems();
      }).catch((error) => {
        showNotification('กู้คืนไม่สำเร็จ — ข้อมูลเดิมยังอยู่ครบ: ' + error.message, 'error');
        console.error('Restore error:', error);
      });
    } catch (error) {
      showNotification('รูปแบบไฟล์ไม่ถูกต้อง', 'error');
      console.error('JSON parse error:', error);
    }
    e.target.value = ''; // รีเซ็ตค่า input
  };
  reader.readAsText(file);
});

    // ✅ ย้ายข้อมูลเก่าจาก root (stock, history) → stock_macro_v1/ ให้อัตโนมัติ ทำครั้งเดียว
    // คัดลอกเหมือนเดิม (copy) ไม่ลบของเก่าทิ้ง — ถ้าพลาดยังกู้ได้เสมอ
    function migrateLegacyRoot() {
      return appRootRef.child('_migratedAt').once('value').then(m => {
        if (m.exists()) return false;
        return Promise.all([
          database.ref('stock').once('value'),
          database.ref('history').once('value')
        ]).then(([oldStock, oldHistory]) => {
          if (!oldStock.exists() && !oldHistory.exists()) return false;
          return Promise.all([
            stockRef.once('value'),
            historyRef.once('value')
          ]).then(([newStock, newHistory]) => {
            const payload = {};
            // ย้ายเฉพาะห้องใหม่ที่ยังว่าง จะได้ไม่ทับของที่กรอกใหม่ไปแล้ว
            if (oldStock.exists() && !newStock.exists()) payload.stock = oldStock.val();
            if (oldHistory.exists() && !newHistory.exists()) payload.history = oldHistory.val();
            if (Object.keys(payload).length === 0) return false;
            payload._migratedAt = new Date().toISOString();
            return appRootRef.update(payload).then(() => true);
          });
        });
      }).catch(err => {
        console.warn('migrate skipped:', err && err.message);
        return false;
      });
    }

    // Start the app
    document.addEventListener('DOMContentLoaded', () => {
      migrateLegacyRoot().then(moved => {
        if (moved) showNotification('ย้ายข้อมูลเข้าห้องใหม่สำเร็จแล้ว');
        initApp();
      });
    });
  </script>

<!-- ================= ระบบล็อกเข้าใช้งาน (รหัสร้าน + ชื่อพนักงาน) ================= -->
<!-- ใช้รหัสเดียวกันกับระบบรับออเดอร์ (racing_order_app/accessCode) -->
<!-- ใส่ครั้งเดียว จำไว้จนกว่าเจ้าของจะเปลี่ยนรหัส → ทุกเครื่องเด้งขึ้นทันที -->
<script>
(function () {
  'use strict';
  if (window.__APP_GATE__) return;
  window.__APP_GATE__ = true;

  var NEED_CODE = true;                 // false = แอปนี้มีระบบรหัสของตัวเองอยู่แล้ว
  var APP_LABEL = 'ระบบสต็อค';
  var DB_URL    = 'https://supertest01-55ac2-default-rtdb.asia-southeast1.firebasedatabase.app/';
  var CODE_PATH = 'racing_order_app/accessCode';
  var LS_CODE   = 'access_code_v1';
  var LS_NAME   = 'staff_name';

  function hashCode(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var css = document.createElement('style');
  css.textContent =
    '#gateOv{display:none;position:fixed;inset:0;background:rgba(17,20,24,.92);z-index:2147483000;' +
    'align-items:center;justify-content:center;font-family:inherit;padding:16px}' +
    '#gateOv.on{display:flex}' +
    '#gateBox{background:#fff;border-radius:16px;padding:28px 24px;max-width:340px;width:100%;' +
    'box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;box-sizing:border-box}' +
    '#gateBox .g-ico{font-size:34px;line-height:1}' +
    '#gateBox .g-ttl{font-size:19px;font-weight:700;color:#2c3e50;margin-top:6px}' +
    '#gateBox .g-sub{font-size:14px;color:#7f8c8d;margin-top:6px}' +
    '#gateBox input{width:100%;font-size:21px;padding:11px 14px;border:2px solid #4CAF50;border-radius:9px;' +
    'text-align:center;box-sizing:border-box;margin:15px 0 4px;-webkit-appearance:none}' +
    '#gateBox input:focus{outline:none;border-color:#2ecc71}' +
    '#gateBox button{background:linear-gradient(135deg,#4CAF50,#2ecc71);color:#fff;border:none;' +
    'padding:12px 20px;border-radius:9px;font-size:17px;font-weight:700;cursor:pointer;width:100%;margin-top:11px}' +
    '#gateBox button:disabled{opacity:.5;cursor:default}' +
    '#gateErr{color:#e74c3c;font-size:14px;min-height:20px;margin:8px 0 0;font-weight:600}' +
    '#gateApp{font-size:12px;color:#b2bec3;margin-top:14px;letter-spacing:.3px}';
  document.head.appendChild(css);

  var ov = document.createElement('div');
  ov.id = 'gateOv';
  ov.innerHTML =
    '<div id="gateBox">' +
      '<div class="g-ico" id="gateIco">🔒</div>' +
      '<div class="g-ttl" id="gateTtl"></div>' +
      '<div class="g-sub" id="gateSub"></div>' +
      '<input id="gateInp" autocomplete="off">' +
      '<p id="gateErr"></p>' +
      '<button id="gateBtn"></button>' +
      '<div id="gateApp"></div>' +
    '</div>';

  function boot() {
    document.body.appendChild(ov);
    var inp = document.getElementById('gateInp');
    var btn = document.getElementById('gateBtn');
    var err = document.getElementById('gateErr');
    document.getElementById('gateApp').textContent = APP_LABEL;

    var step = null;

    function show(s) {
      step = s;
      err.textContent = '';
      btn.disabled = false;
      if (s === 'code') {
        document.getElementById('gateIco').textContent = '🔒';
        document.getElementById('gateTtl').textContent = 'ใส่รหัสเข้าใช้งาน';
        document.getElementById('gateSub').textContent = 'รหัสเดียวกับระบบรับออเดอร์ · ใส่แค่ครั้งแรก';
        inp.type = 'password';
        inp.maxLength = 12;
        inp.placeholder = '••••••';
        btn.textContent = '✅ เข้าใช้งาน';
      } else {
        document.getElementById('gateIco').textContent = '👤';
        document.getElementById('gateTtl').textContent = 'ยินดีต้อนรับ!';
        document.getElementById('gateSub').textContent = 'พิมพ์ชื่อของคุณเพื่อเริ่มใช้งาน';
        inp.type = 'text';
        inp.maxLength = 20;
        inp.placeholder = 'ชื่อพนักงาน';
        btn.textContent = '✅ เริ่มงาน';
      }
      inp.value = '';
      ov.classList.add('on');
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 80);
    }

    function hide() { ov.classList.remove('on'); }

    function applyName(name) {
      lsSet(LS_NAME, name);
      window.APP_STAFF_NAME = name;
      // ส่งต่อให้แอปที่ใช้ชื่อคนละคีย์
      lsSet('cashier_staff', name);
      if (typeof window.STAFF !== 'undefined') window.STAFF = name;
      if (typeof window.currentStaffName !== 'undefined') window.currentStaffName = name;
      try { if (typeof window.updateStaffBadge === 'function') window.updateStaffBadge(); } catch (e) {}
      try { window.dispatchEvent(new CustomEvent('staffnamechange', { detail: name })); } catch (e) {}
    }

    function needName() {
      var n = (lsGet(LS_NAME) || '').trim();
      if (n) { applyName(n); hide(); return; }
      show('name');
    }

    function submit() {
      var v = (inp.value || '').trim();
      if (!v) { err.textContent = step === 'code' ? '❌ กรุณาใส่รหัสก่อน' : '❌ กรุณาใส่ชื่อ'; return; }
      if (step === 'name') { applyName(v); hide(); return; }
      err.textContent = '';
      btn.disabled = true;
      fetch(DB_URL + CODE_PATH + '.json?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (stored) {
          btn.disabled = false;
          var h = hashCode(v);
          if (!stored) {                       // ยังไม่เคยตั้งรหัส → ตั้งครั้งแรก
            if (window.firebase && firebase.apps && firebase.apps.length) {
              firebase.database().ref(CODE_PATH).set(h);
            }
            lsSet(LS_CODE, h); needName(); return;
          }
          if (h === stored) { lsSet(LS_CODE, stored); needName(); }
          else { err.textContent = '❌ รหัสไม่ถูกต้อง'; inp.value = ''; inp.focus(); }
        })
        .catch(function () {
          btn.disabled = false;
          err.textContent = '❌ เชื่อมต่อ Firebase ไม่ได้ ลองใหม่';
        });
    }

    btn.onclick = submit;
    inp.onkeydown = function (e) { if (e.key === 'Enter') submit(); };

    // เปลี่ยนชื่อพนักงานได้ตลอด (เรียกจาก console หรือปุ่มในแอป)
    window.appChangeStaffName = function () { show('name'); };
    window.appLockNow = function () { show(NEED_CODE ? 'code' : 'name'); };

    if (!NEED_CODE) { needName(); return; }

    show('code');                              // ล็อกไว้ก่อนเสมอ
    fetch(DB_URL + CODE_PATH + '.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (stored) {
        var saved = lsGet(LS_CODE);
        if (!stored || (saved && saved === stored)) needName();
        // เฝ้าดูการเปลี่ยนรหัส → ล็อกทุกเครื่องทันที
        if (window.firebase && firebase.apps && firebase.apps.length) {
          firebase.database().ref(CODE_PATH).on('value', function (snap) {
            var cur = snap.val();
            if (!cur) return;
            if (lsGet(LS_CODE) !== cur) show('code');
          });
        }
      })
      .catch(function () { show('code'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<!-- ================= จบระบบล็อกเข้าใช้งาน ================= -->
</body>
</html>
